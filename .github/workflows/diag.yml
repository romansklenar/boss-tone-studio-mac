# Temporary: find where Swift Testing lives on the runner's Command Line Tools. Removed before merge.
name: Diag
on:
  push:
    branches: [fix/ci-clt-26-6]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch /Library/Developer/CommandLineTools
      - name: Toolchain
        run: |
          echo "image $ImageVersion"
          xcode-select -p
          swift --version 2>&1 | head -1
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables | grep version
          ls /Applications | grep -i xcode
          find /Library/Developer/CommandLineTools \( -name 'Testing.framework' -o -name 'Testing.swiftmodule' \
            -o -name '*TestingInterop*' -o -name 'libTestingMacros*' -o -name 'XCTest.framework' \) 2>/dev/null
          ls /Library/Developer/CommandLineTools/usr/lib/swift/host/plugins/testing 2>&1
          ls /Library/Developer/CommandLineTools/Library/Developer 2>&1
      - name: Test-target flags
        run: |
          swift build --build-tests -Xswiftc -warnings-as-errors -v 2>&1 \
            | grep -oE -- '(-F|-I|-L|-Xlinker -rpath -Xlinker|-plugin-path|-external-plugin-path|-sdk) [^ ]+' \
            | sort -u | head -40 || true
      - run: make test 2>&1 | tail -5
