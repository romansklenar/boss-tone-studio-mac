# Temporary: find why Swift 6.3.3 from Command Line Tools 26.6 misses Swift Testing. Removed before merge.
name: Diag
on:
  push:
    branches: [fix/ci-clt-26-6]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: macos-26
    steps:
      - name: Image
        id: image
        run: |
          echo "image $ImageVersion; CLT $(pkgutil --pkg-info=com.apple.pkg.CLTools_Executables | sed -n 's/^version: //p')"
          case "$ImageVersion" in 20261026*) echo "new=1" >> "$GITHUB_OUTPUT" ;; esac
      - if: steps.image.outputs.new
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.image.outputs.new
        name: Toolchain
        continue-on-error: true
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          swift --version 2>&1 | head -1
          ls /Library/Developer/CommandLineTools/Library/Developer/Frameworks
          ls /Library/Developer/CommandLineTools/usr/lib/swift/host/plugins
      - if: steps.image.outputs.new
        name: Flags as the Makefile builds
        continue-on-error: true
        run: |
          swift build --build-tests -v $(make -s -p -n test 2>/dev/null | sed -n 's/^SWIFT_FLAGS := //p') 2>&1 \
            | grep -oE -- '(-F|-I|-L|-plugin-path|-external-plugin-path) [^ ]+' | sort -u | head -30
      - if: steps.image.outputs.new
        name: make test
        continue-on-error: true
        run: make test 2>&1 | grep -E "error|Test run|Swift 6" | sort -u | head -10
      - if: steps.image.outputs.new
        name: make test with the framework path
        continue-on-error: true
        run: |
          rm -rf .build
          fw=/Library/Developer/CommandLineTools/Library/Developer/Frameworks
          make test SWIFT_FLAGS="-Xswiftc -warnings-as-errors -Xswiftc -F -Xswiftc $fw -Xlinker -rpath -Xlinker $fw" \
            2>&1 | grep -E "error|Test run|Swift 6" | sort -u | head -10
      - if: steps.image.outputs.new
        name: make test without the plugin-path workaround
        continue-on-error: true
        run: |
          rm -rf .build
          make test SWIFT_FLAGS="-Xswiftc -warnings-as-errors" 2>&1 | grep -E "error|Test run|Swift 6" | sort -u | head -10
