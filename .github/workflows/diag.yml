# Temporary: check `make test` on the runner image with Command Line Tools 26.6. Removed before merge.
name: Diag
on:
  push:
    branches: [fix/ci-clt-26-6]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: macos-26
    steps:
      - name: Image
        id: image
        run: |
          echo "image $ImageVersion; CLT $(pkgutil --pkg-info=com.apple.pkg.CLTools_Executables | sed -n 's/^version: //p')"
          case "$ImageVersion" in 20261026*) echo "new=1" >> "$GITHUB_OUTPUT" ;; esac
      - if: steps.image.outputs.new
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.image.outputs.new
        run: sudo xcode-select --switch /Library/Developer/CommandLineTools
      - if: steps.image.outputs.new
        run: make test
